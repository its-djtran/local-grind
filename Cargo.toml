[workspace]
resolver = "2"
members = ["crates/core", "crates/content", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tempfile = "3"
toml = "1"
libc = "0.2"
miniz_oxide = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
