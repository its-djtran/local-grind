id = 124
title = "Binary Tree Maximum Path Sum"
difficulty = "Hard"
topics = ["Dynamic Programming", "Tree", "Depth-First Search", "Binary Tree"]
time_limit_ms = 1500
hints = [
  "Every path has exactly one highest node, where it may turn from the left subtree into the right subtree. Try every node as that turning point.",
  "For the turning point you need the best sum of a path that starts at a child and only goes downward. Can a single post-order pass compute that for every node at once?",
  "A downward branch with a negative sum only hurts; treat it as 0 (just don't take it). Keep a running global best of node.val + left gain + right gain.",
  "Start the global best at negative infinity, not 0 — a tree of only negative values still has a (negative) answer.",
]

[signature]
kind = "function"
name = "maxPathSum"
params = [{ name = "root", type = "TreeNode" }]
returns = "int"

[[examples]]
input = "[1,2,3]"
output = "6"
explanation = "The path 2 -> 1 -> 3 has sum 2 + 1 + 3 = 6."

[[examples]]
input = "[-10,9,20,null,null,15,7]"
output = "42"
explanation = "The path 15 -> 20 -> 7 has sum 15 + 20 + 7 = 42; including -10 would only lower it."
