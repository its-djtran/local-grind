id = 150
title = "Evaluate Reverse Polish Notation"
difficulty = "Medium"
topics = ["Array", "Math", "Stack"]
time_limit_ms = 500
hints = [
  "In postfix notation an operator always applies to the two most recent values that have not been consumed yet. Which data structure gives you the most recent items first?",
  "Push numbers onto a stack. On an operator, pop two values, combine them, and push the result back.",
  "Order matters for - and /: the value popped first is the right operand. Also check how Python's // rounds negative quotients compared with truncation toward zero.",
]

[signature]
kind = "function"
name = "evalRPN"
params = [{ name = "tokens", type = "string[]" }]
returns = "int"

[[examples]]
input = """["2","1","+","3","*"]"""
output = "9"
explanation = "In ordinary notation this is (2 + 1) * 3 = 9."

[[examples]]
input = """["4","13","5","/","+"]"""
output = "6"
explanation = "13 / 5 truncates to 2, and 4 + 2 = 6."

[[examples]]
input = """["10","6","9","3","+","-11","*","/","*","17","+","5","+"]"""
output = "22"
explanation = "9 + 3 = 12; 12 * -11 = -132; 6 / -132 truncates to 0; 10 * 0 = 0; 0 + 17 = 17; 17 + 5 = 22."
