id = 377
title = "Combination Sum IV"
difficulty = "Medium"
topics = ["Array", "Dynamic Programming"]
time_limit_ms = 2000
hints = [
  "Order matters here: (1, 2) and (2, 1) count separately. Think about which number comes last in the sequence.",
  "If the last number is x, the numbers before it form an ordered sequence summing to target - x. So ways(t) is the sum of ways(t - x) over every x in nums with x <= t.",
  "ways(0) = 1 (the empty sequence). Compute ways(t) for t = 1, 2, ..., target in that order.",
  "Be careful with loop order: looping over totals on the outside and numbers on the inside counts ordered sequences; the other way around counts unordered combinations.",
]

[signature]
kind = "function"
name = "combinationSum4"
params = [{ name = "nums", type = "int[]" }, { name = "target", type = "int" }]
returns = "int"

[[examples]]
input = """
[1,2,3]
4"""
output = "7"
explanation = "The ordered sequences are (1,1,1,1), (1,1,2), (1,2,1), (2,1,1), (2,2), (1,3) and (3,1)."

[[examples]]
input = """
[9]
3"""
output = "0"
explanation = "9 is already larger than 3, so no sequence works."
