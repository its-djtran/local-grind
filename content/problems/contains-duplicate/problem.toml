id = 217
title = "Contains Duplicate"
difficulty = "Easy"
topics = ["Array", "Hash Table", "Sorting"]
time_limit_ms = 2000
hints = [
  "Comparing every pair of elements answers the question, but it is quadratic. What structure lets you ask \"have I seen this value before?\" in constant time?",
  "Walk the array once, remembering each value in a hash set; stop as soon as a value is already present.",
  "Alternatively, after sorting, any equal values end up next to each other.",
]

[signature]
kind = "function"
name = "containsDuplicate"
params = [{ name = "nums", type = "int[]" }]
returns = "bool"

[[examples]]
input = "[1,2,3,1]"
output = "true"
explanation = "The value 1 appears at index 0 and again at index 3."

[[examples]]
input = "[1,2,3,4]"
output = "false"
explanation = "All four values are different."

[[examples]]
input = "[1,1,1,3,3,4,3,2,4,2]"
output = "true"
