id = 73
title = "Set Matrix Zeroes"
difficulty = "Medium"
topics = ["Array", "Hash Table", "Matrix"]
time_limit_ms = 500
hints = [
  "Zeroing a row as soon as you see a 0 destroys information: later you cannot tell original zeros from ones you wrote. Record first, modify second.",
  "It is enough to remember which rows and which columns contain a zero. Two boolean arrays of sizes m and n do the job.",
  "To get rid of those arrays, store the markers inside the matrix itself: use the first row and first column as the flags, and keep two extra booleans for whether the first row and first column must be cleared too.",
]

[signature]
kind = "function"
name = "setZeroes"
params = [{ name = "matrix", type = "int[][]" }]
returns = "void"
output_param = "matrix"

[[examples]]
input = "[[1,1,1],[1,0,1],[1,1,1]]"
output = "[[1,0,1],[0,0,0],[1,0,1]]"
explanation = "The only zero sits at row 1, column 1, so that entire row and that entire column become 0."

[[examples]]
input = "[[0,1,2,0],[3,4,5,2],[1,3,1,5]]"
output = "[[0,0,0,0],[0,4,5,0],[0,3,1,0]]"
explanation = "Zeros in row 0 at columns 0 and 3 clear row 0 plus columns 0 and 3."
