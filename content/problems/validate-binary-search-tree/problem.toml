id = 98
title = "Validate Binary Search Tree"
difficulty = "Medium"
topics = ["Tree", "Depth-First Search", "Binary Search Tree", "Binary Tree"]
time_limit_ms = 2000
hints = [
  "Checking each node only against its two children is not enough: a node deep in the left subtree must still be smaller than the root.",
  "Every node must lie inside an open interval (low, high) that is inherited from its ancestors. How does the interval change when you step left or right?",
  "Alternatively, an in-order traversal of a valid BST visits values in strictly increasing order. You only need to remember the previous value.",
]

[signature]
kind = "function"
name = "isValidBST"
params = [{ name = "root", type = "TreeNode" }]
returns = "bool"

[[examples]]
input = "[2,1,3]"
output = "true"

[[examples]]
input = "[5,1,4,null,null,3,6]"
output = "false"
explanation = "The root holds 5, yet its right child holds 4, which is smaller than 5."
