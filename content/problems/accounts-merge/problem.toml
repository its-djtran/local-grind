id = 721
title = "Accounts Merge"
difficulty = "Medium"
topics = ["Array", "Hash Table", "String", "Depth-First Search", "Breadth-First Search", "Union Find", "Sorting"]
time_limit_ms = 1000
hints = [
  "Two accounts belong to the same person if they share an email, and this relation chains: A shares with B and B shares with C means A, B and C are one person.",
  "Think of every email as a node and connect all emails listed in the same account. Each person is a connected component.",
  "Union-find over emails (union each email with the first email of its account) makes the components easy to collect. Remember the owner's name for each email, then sort each component.",
]

[signature]
kind = "function"
name = "accountsMerge"
params = [{ name = "accounts", type = "string[][]" }]
returns = "string[][]"

[judge]
mode = "unordered"

[[examples]]
input = """[["John","johnsmith@mail.com","john_newyork@mail.com"],["John","johnsmith@mail.com","john00@mail.com"],["Mary","mary@mail.com"],["John","johnnybravo@mail.com"]]"""
output = """[["John","john00@mail.com","john_newyork@mail.com","johnsmith@mail.com"],["Mary","mary@mail.com"],["John","johnnybravo@mail.com"]]"""
explanation = "The first two accounts share johnsmith@mail.com, so they are merged. The last John has no email in common with them, so he is a different person who happens to have the same name."

[[examples]]
input = """[["Gabe","Gabe0@m.co","Gabe3@m.co","Gabe1@m.co"],["Kevin","Kevin3@m.co","Kevin5@m.co","Kevin0@m.co"],["Ethan","Ethan5@m.co","Ethan4@m.co","Ethan0@m.co"],["Hanzo","Hanzo3@m.co","Hanzo1@m.co","Hanzo0@m.co"],["Fern","Fern5@m.co","Fern1@m.co","Fern0@m.co"]]"""
output = """[["Ethan","Ethan0@m.co","Ethan4@m.co","Ethan5@m.co"],["Gabe","Gabe0@m.co","Gabe1@m.co","Gabe3@m.co"],["Hanzo","Hanzo0@m.co","Hanzo1@m.co","Hanzo3@m.co"],["Kevin","Kevin0@m.co","Kevin3@m.co","Kevin5@m.co"],["Fern","Fern0@m.co","Fern1@m.co","Fern5@m.co"]]"""
explanation = "No two accounts share an email, so each one only has its emails sorted."
