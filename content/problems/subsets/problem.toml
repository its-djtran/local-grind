id = 78
title = "Subsets"
difficulty = "Medium"
topics = ["Array", "Backtracking", "Bit Manipulation"]
time_limit_ms = 2000
hints = [
  "Every element is either in a subset or not. How many subsets does that give for n elements?",
  "Start from the list containing only the empty subset. Each new element doubles the list: keep every existing subset, and add a copy of it extended with the new element.",
  "Alternatively, the binary digits of each number from 0 to 2^n - 1 describe one subset.",
]

[signature]
kind = "function"
name = "subsets"
params = [{ name = "nums", type = "int[]" }]
returns = "int[][]"

[judge]
mode = "unordered_nested"

[[examples]]
input = "[1,2,3]"
output = "[[],[1],[2],[1,2],[3],[1,3],[2,3],[1,2,3]]"

[[examples]]
input = "[0]"
output = "[[],[0]]"
