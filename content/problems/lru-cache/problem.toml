id = 146
title = "LRU Cache"
difficulty = "Medium"
topics = ["Hash Table", "Linked List", "Design", "Doubly-Linked List"]
time_limit_ms = 1000
hints = [
  "A hash map gives O(1) lookup by key, but it does not tell you which key was used least recently. What structure keeps items in recency order and lets you move any item to the front in O(1)?",
  "A doubly linked list can unlink any node in O(1) if you already hold a reference to it. Store those node references in the hash map.",
  "Sentinel head and tail nodes remove the empty-list special cases. On every get or put, move the node to the most-recent end; on overflow, remove the node at the least-recent end.",
  "In Python, collections.OrderedDict already combines both structures: see move_to_end and popitem(last=False).",
]

[signature]
kind = "design"
class = "LRUCache"
constructor = [{ name = "capacity", type = "int" }]
methods = [
  { name = "get", params = [{ name = "key", type = "int" }], returns = "int" },
  { name = "put", params = [{ name = "key", type = "int" }, { name = "value", type = "int" }], returns = "void" },
]

[[examples]]
input = """
["LRUCache","put","put","get","put","get","put","get","get","get"]
[[2],[1,1],[2,2],[1],[3,3],[2],[4,4],[1],[3],[4]]"""
output = "[null,null,null,1,null,-1,null,-1,3,4]"
explanation = "With capacity 2: after put(1,1) and put(2,2), get(1) returns 1 and makes key 1 the most recent. put(3,3) then evicts key 2, so get(2) returns -1. put(4,4) evicts key 1 (key 3 was used more recently), so get(1) returns -1 while get(3) and get(4) return 3 and 4."
