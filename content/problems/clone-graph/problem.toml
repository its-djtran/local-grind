id = 133
title = "Clone Graph"
difficulty = "Medium"
topics = ["Hash Table", "Depth-First Search", "Breadth-First Search", "Graph"]
time_limit_ms = 2000
hints = [
  "Every original node needs exactly one copy. How will you find the copy of a node you have already met?",
  "Keep a hash map from each original node to its clone; the map doubles as the visited set.",
  "Traverse the graph (DFS or BFS). Create a node's clone the first time you see it, then append the clones of its neighbors.",
]

[signature]
kind = "function"
name = "cloneGraph"
params = [{ name = "node", type = "Node" }]
returns = "Node"
special = "deep_copy"

[[examples]]
input = "[[2,4],[1,3],[2,4],[1,3]]"
output = "[[2,4],[1,3],[2,4],[1,3]]"
explanation = "The graph has four nodes. Node 1 touches 2 and 4, node 2 touches 1 and 3, node 3 touches 2 and 4, and node 4 touches 1 and 3. The copy must have exactly the same shape, built from brand-new nodes."

[[examples]]
input = "[[]]"
output = "[[]]"
explanation = "A single node with no neighbors."

[[examples]]
input = "[]"
output = "[]"
explanation = "The graph is empty, so there is nothing to copy."
