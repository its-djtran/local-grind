id = 23
title = "Merge k Sorted Lists"
difficulty = "Hard"
topics = ["Linked List", "Divide and Conquer", "Heap (Priority Queue)", "Merge Sort"]
time_limit_ms = 1000
hints = [
  "You already know how to merge two sorted lists. What does it cost to fold the lists in one at a time when there are thousands of them?",
  "The next node of the answer is always the smallest among the current heads of the k lists. Which data structure hands you the minimum quickly?",
  "Keep the k heads in a min-heap. Pop the smallest, append it, and push that node's successor. Add a tie-breaker so nodes are never compared directly.",
  "Alternatively, merge the lists in pairs, round after round, like merge sort: each round halves the number of lists.",
]

[signature]
kind = "function"
name = "mergeKLists"
params = [{ name = "lists", type = "ListNode[]" }]
returns = "ListNode"

[[examples]]
input = "[[1,4,5],[1,3,4],[2,6]]"
output = "[1,1,2,3,4,4,5,6]"
explanation = "Interleaving the three sorted lists 1->4->5, 1->3->4 and 2->6 gives 1->1->2->3->4->4->5->6."

[[examples]]
input = "[]"
output = "[]"

[[examples]]
input = "[[]]"
output = "[]"
