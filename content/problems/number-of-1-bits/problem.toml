id = 191
title = "Number of 1 Bits"
difficulty = "Easy"
topics = ["Divide and Conquer", "Bit Manipulation"]
time_limit_ms = 1000
hints = [
  "You can inspect the lowest bit of n with n & 1 and then shift n right by one.",
  "Looping over every bit position works, but can you skip straight from one set bit to the next?",
  "What happens to the lowest set bit of n when you compute n & (n - 1)?",
]

[signature]
kind = "function"
name = "hammingWeight"
params = [{ name = "n", type = "int" }]
returns = "int"

[[examples]]
input = "11"
output = "3"
explanation = "11 is 1011 in binary, which contains three 1 bits."

[[examples]]
input = "128"
output = "1"
explanation = "128 is 10000000 in binary: a single 1 bit."

[[examples]]
input = "2147483645"
output = "30"
explanation = "2147483645 is 1111111111111111111111111111101 in binary (31 digits), and all but one of them are 1."
