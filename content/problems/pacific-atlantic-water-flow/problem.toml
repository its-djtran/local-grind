id = 417
title = "Pacific Atlantic Water Flow"
difficulty = "Medium"
topics = ["Array", "Depth-First Search", "Breadth-First Search", "Matrix"]
time_limit_ms = 2000
hints = [
  "Simulating the flow from every single cell repeats an enormous amount of work.",
  "Reverse the direction: start at the ocean and climb. Which cells can the Pacific be reached from?",
  "Run one search from all Pacific border cells and one from all Atlantic border cells, moving only to neighbors that are at least as high. Answer with the cells marked by both.",
]

[signature]
kind = "function"
name = "pacificAtlantic"
params = [{ name = "heights", type = "int[][]" }]
returns = "int[][]"

[judge]
mode = "unordered"

[[examples]]
input = "[[1,2,2,3,5],[3,2,3,4,4],[2,4,5,3,1],[6,7,1,4,5],[5,1,1,2,4]]"
output = "[[0,4],[1,3],[1,4],[2,2],[3,0],[3,1],[4,0]]"
explanation = "For instance, rain on cell [2,2] (height 5) can run up-and-left through [1,2] (3) and [0,2] (2) into the Pacific, and right-and-down through [2,3] (3) and [2,4] (1) into the Atlantic. Cell [3,0] lies on the left border (Pacific) and can descend to [4,0] on the bottom border (Atlantic)."

[[examples]]
input = "[[1]]"
output = "[[0,0]]"
explanation = "The only cell borders both oceans."
