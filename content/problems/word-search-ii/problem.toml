id = 212
title = "Word Search II"
difficulty = "Hard"
topics = ["Array", "String", "Backtracking", "Trie", "Matrix"]
time_limit_ms = 3000
hints = [
  "Running a separate grid search for each of up to 30000 words repeats the same exploration over and over. Can all words be searched at once?",
  "Put the words in a trie. A depth-first search from a cell can then walk the board and the trie together, abandoning a path as soon as it is not a prefix of any word.",
  "Mark cells as used while they are on the current path and restore them when backtracking.",
  "After a word is found, remove it from the trie (and prune nodes that become empty) so later searches do not re-explore paths that can no longer produce anything new.",
]

[signature]
kind = "function"
name = "findWords"
params = [{ name = "board", type = "char[][]" }, { name = "words", type = "string[]" }]
returns = "string[]"

[judge]
mode = "unordered"

[[examples]]
input = """
[["o","a","a","n"],["e","t","a","e"],["i","h","k","r"],["i","f","l","v"]]
["oath","pea","eat","rain"]"""
output = "[\"eat\",\"oath\"]"

[[examples]]
input = """
[["a","b"],["c","d"]]
["abcb"]"""
output = "[]"
explanation = "Spelling \"abcb\" would require visiting the cell holding \"b\" twice."
