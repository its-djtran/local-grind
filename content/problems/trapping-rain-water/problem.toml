id = 42
title = "Trapping Rain Water"
difficulty = "Hard"
topics = ["Array", "Two Pointers", "Dynamic Programming", "Stack", "Monotonic Stack"]
time_limit_ms = 1000
hints = [
  "Think about one column at a time. How high can water stand above it?",
  "Water above column i rises to the shorter of the tallest bar to its left and the tallest bar to its right (each including column i itself). Subtract height[i].",
  "Precomputing the running maximum from the left and from the right gives an O(n) solution with two extra arrays.",
  "To use O(1) extra space, move two pointers inward from both ends. The side whose running maximum is smaller already knows its water level, because the other side is guaranteed to have a wall at least that tall.",
]

[signature]
kind = "function"
name = "trap"
params = [{ name = "height", type = "int[]" }]
returns = "int"

[[examples]]
input = "[0,1,0,2,1,0,1,3,2,1,2,1]"
output = "6"
explanation = "Water collects above indices 2 (1 unit), 4 (1), 5 (2), 6 (1) and 9 (1), for a total of 6 units."

[[examples]]
input = "[4,2,0,3,2,5]"
output = "9"
