id = 33
title = "Search in Rotated Sorted Array"
difficulty = "Medium"
topics = ["Array", "Binary Search"]
time_limit_ms = 1000
hints = [
  "Plain binary search fails because the array is not globally sorted. But if you split it at any midpoint, at least one of the two halves is sorted.",
  "Compare nums[lo] with nums[mid] to tell which half is sorted.",
  "Once you know a half is sorted, a range check tells you whether the target can be inside it. If it can, search there; otherwise search the other half.",
]

[signature]
kind = "function"
name = "search"
params = [{ name = "nums", type = "int[]" }, { name = "target", type = "int" }]
returns = "int"

[[examples]]
input = """
[4,5,6,7,0,1,2]
0"""
output = "4"

[[examples]]
input = """
[4,5,6,7,0,1,2]
3"""
output = "-1"

[[examples]]
input = """
[1]
0"""
output = "-1"
