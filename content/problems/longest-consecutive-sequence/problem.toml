id = 128
title = "Longest Consecutive Sequence"
difficulty = "Medium"
topics = ["Array", "Hash Table", "Union Find"]
time_limit_ms = 2000
hints = [
  "Sorting makes runs easy to see, but costs O(n log n). Can a hash set answer \"is x + 1 present?\" fast enough?",
  "If you start counting upward from every number, a long run is re-counted from each of its members — quadratic in the worst case.",
  "Only start counting at a number x when x - 1 is not in the set; then each number is visited by at most one upward walk.",
]

[signature]
kind = "function"
name = "longestConsecutive"
params = [{ name = "nums", type = "int[]" }]
returns = "int"

[[examples]]
input = "[100,4,200,1,3,2]"
output = "4"
explanation = "The values 1, 2, 3 and 4 are all present, giving a run of length 4."

[[examples]]
input = "[0,3,7,2,5,8,4,6,0,1]"
output = "9"
explanation = "Every integer from 0 to 8 appears (0 appears twice), so the run has length 9."

[[examples]]
input = "[1,0,1,2]"
output = "3"
