id = 84
title = "Largest Rectangle in Histogram"
difficulty = "Hard"
topics = ["Array", "Stack", "Monotonic Stack"]
time_limit_ms = 2000
hints = [
  "The best rectangle is limited by its shortest bar. Try fixing that bar: if bar i is the shortest, how far can the rectangle stretch left and right?",
  "It stretches until the first strictly shorter bar on each side. Finding those boundaries naively costs O(n) per bar.",
  "Keep a stack of indices whose heights increase from bottom to top. When a shorter bar arrives, every taller bar it pops has just found its right boundary, and the bar below it on the stack is its left boundary.",
  "Appending a bar of height 0 at the end forces every remaining bar off the stack.",
]

[signature]
kind = "function"
name = "largestRectangleArea"
params = [{ name = "heights", type = "int[]" }]
returns = "int"

[[examples]]
input = "[2,1,5,6,2,3]"
output = "10"
explanation = "The bars of height 5 and 6 at indices 2 and 3 together support a rectangle of height 5 and width 2, with area 10."

[[examples]]
input = "[2,4]"
output = "4"
