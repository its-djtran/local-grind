id = 226
title = "Invert Binary Tree"
difficulty = "Easy"
topics = ["Tree", "Depth-First Search", "Breadth-First Search", "Binary Tree"]
time_limit_ms = 1000
hints = [
  "Mirroring a tree means every node ends up with its left and right children exchanged.",
  "Swap the two children of the root, then apply the same idea to each child. What should an empty tree return?",
  "If you swap with two separate assignments, make sure the first one does not overwrite a child you still need.",
]

[signature]
kind = "function"
name = "invertTree"
params = [{ name = "root", type = "TreeNode" }]
returns = "TreeNode"

[[examples]]
input = "[4,2,7,1,3,6,9]"
output = "[4,7,2,9,6,3,1]"

[[examples]]
input = "[2,1,3]"
output = "[2,3,1]"

[[examples]]
input = "[]"
output = "[]"
