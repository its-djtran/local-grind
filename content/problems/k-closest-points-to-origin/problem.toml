id = 973
title = "K Closest Points to Origin"
difficulty = "Medium"
topics = ["Array", "Math", "Divide and Conquer", "Geometry", "Sorting", "Heap (Priority Queue)", "Quickselect"]
time_limit_ms = 2000
hints = [
  "Comparing distances does not require square roots: x*x + y*y orders points the same way as the true distance.",
  "Sorting all points by squared distance and taking the first k works. Can you avoid fully ordering points you will throw away?",
  "A max-heap holding the k best points so far lets each new point evict the current worst in O(log k).",
  "Quickselect partitions around a pivot distance and recurses into only one side, giving average linear time.",
]

[signature]
kind = "function"
name = "kClosest"
params = [{ name = "points", type = "int[][]" }, { name = "k", type = "int" }]
returns = "int[][]"

[judge]
mode = "unordered"

[[examples]]
input = """
[[1,3],[-2,2]]
1"""
output = "[[-2,2]]"
explanation = "Squared distances are 1 + 9 = 10 for (1,3) and 4 + 4 = 8 for (-2,2), so (-2,2) is closer."

[[examples]]
input = """
[[3,3],[5,-1],[-2,4]]
2"""
output = "[[3,3],[-2,4]]"
explanation = "Squared distances are 18, 26 and 20. The two smallest belong to (3,3) and (-2,4); [[-2,4],[3,3]] is equally correct."
