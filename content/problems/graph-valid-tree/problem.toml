id = 261
title = "Graph Valid Tree"
difficulty = "Medium"
topics = ["Depth-First Search", "Breadth-First Search", "Union Find", "Graph"]
time_limit_ms = 500
hints = [
  "A tree on n nodes is connected and has no cycles. How many edges must it have?",
  "If the number of edges is not exactly n - 1, you can answer immediately.",
  "With exactly n - 1 edges, being connected and being acyclic are equivalent, so check just one of them: a single traversal from node 0, or union-find that fails when an edge joins two already-connected nodes.",
]

[signature]
kind = "function"
name = "validTree"
params = [{ name = "n", type = "int" }, { name = "edges", type = "int[][]" }]
returns = "bool"

[[examples]]
input = """
5
[[0,1],[0,2],[0,3],[1,4]]"""
output = "true"
explanation = "The five nodes are connected by four edges with no cycle."

[[examples]]
input = """
5
[[0,1],[1,2],[2,3],[1,3],[1,4]]"""
output = "false"
explanation = "Nodes 1, 2 and 3 form a cycle."
